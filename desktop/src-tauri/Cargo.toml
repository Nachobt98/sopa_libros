[package]
name = "sopa_libros_desktop"
version = "0.1.0"
description = "Desktop shell for sopa-libros"
authors = ["sopa-libros"]
edition = "2021"

[lib]
name = "sopa_libros_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

